name: Publicar atualização Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias frontend
        run: npm install
      - name: Compilar motor C++
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -A x64
          cmake --build engine/build --config Release
      - name: Build e publicacao Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASG Institutional Flow ${{ github.ref_name }}'
          releaseBody: 'Atualização oficial do aplicativo ASG.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
