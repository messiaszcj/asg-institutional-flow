name: Publicar atualização Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar motor C++
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -A x64
          cmake --build engine/build --config Release

      - name: Compilar frontend React
        run: npm run build

      - name: Verificar arquivos do frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "ERRO: dist/index.html nao foi gerado."
          }

          Write-Host "Frontend compilado com sucesso!"

      - name: Verificar configuracao Tauri
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            throw "ERRO: tauri.conf.json nao encontrado."
          }

          $config = Get-Content "src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json

          Write-Host "Versao Tauri: $($config.version)"
          Write-Host "Frontend: $($config.build.frontendDist)"

          if ($config.bundle.createUpdaterArtifacts -ne $true) {
            throw "ERRO: createUpdaterArtifacts precisa ser true."
          }

          Write-Host "Configuracao Tauri validada!"

      - name: Build e publicacao Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 'ASG Institutional Flow ${{ github.ref_name }}'
          releaseBody: 'Atualização oficial do aplicativo ASG.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
